# Weekly check of job URLs that have no public ATS feed.
# HEAD, then GET only when needed, 1 request/second, 25s timeout, no retries.
# Checks out and pushes main explicitly. See docs/DEPLOY.md and docs/JOB_FILTER_RULES.md.
name: link-check-jobs

on:
  schedule:
    - cron: "40 23 * * 1"   # Mondays 23:40 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Link-check HTML-only job URLs
        run: python3 scripts/linkcheck_jobs.py --delay 1.0
      - name: Validate
        run: python3 scripts/validate.py
      - name: Build (sanity check)
        run: python3 scripts/build.py && python3 scripts/check_jsonld.py
      - name: Commit data changes to main
        id: commit
        run: |
          git config user.name "remotejob-vn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
            exit 0
          fi
          git add data/
          git commit -m "chore(data): weekly job link check $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: IndexNow
        if: steps.commit.outputs.changed == 'true'
        run: python3 scripts/indexnow.py

  alert:
    needs: linkcheck
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Open or update the data-health issue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_RESULT: failure
        run: python3 scripts/data_health.py --open-issue --workflow-result failure --reason "The weekly HTML link-check workflow failed."
